<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_stack" name="shell-type">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#051424",
            "background": "#051424",
            "on-surface": "#d4e4fa",
            "on-background": "#d4e4fa",
            "on-surface-variant": "#bccbb9",
            "surface-variant": "#273647",
            "surface-bright": "#2c3a4c",
            "surface-dim": "#051424",
            "surface-container-lowest": "#010f1f",
            "surface-container-low": "#0d1c2d",
            "surface-container": "#122131",
            "surface-container-high": "#1c2b3c",
            "surface-container-highest": "#273647",
            "primary": "#4be277",
            "primary-container": "#22c55e",
            "on-primary": "#003915",
            "secondary": "#ffca45",
            "secondary-container": "#e4ae00",
            "on-secondary": "#3f2e00",
            "tertiary": "#ffb4ae",
            "error": "#ffb4ab",
            "outline": "#869585",
            "outline-variant": "#3d4a3d"
          },
          fontFamily: {
            "headline-sm": ["Inter"],
            "headline-md": ["Inter"],
            "headline-lg": ["Inter"],
            "display-hero-mobile": ["Inter"],
            "label-sm": ["Inter"],
            "label-md": ["Inter"],
            "label-lg": ["Inter"],
            "body-sm": ["Inter"],
            "body-md": ["Inter"],
            "body-lg": ["Inter"],
            "numeric-metric": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "margin": "1rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-lg": "1rem",
            "space-xl": "1.5rem"
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #051424;
        color: #d4e4fa;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        min-height: max(884px, 100dvh);
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<!-- Header matching SCREEN_17 aesthetic with Step Stepper -->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.25)]">
<div class="px-margin pt-2 pb-3 flex flex-col gap-2">
<!-- Title row -->
<div class="h-11 flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Credit Cards</span>
</div>
<div class="inline-flex items-center gap-1 bg-surface-variant/50 border border-outline-variant/30 px-2.5 py-1 rounded-full">
<span class="h-1.5 w-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-[11px] text-primary font-bold tracking-wide">3 of 6</span>
</div>
</div>
<!-- Segmented Stepper Bar -->
<div class="flex items-center gap-1.5 w-full px-0.5">
<!-- Step 1 Complete -->
<div class="flex-1 h-1 rounded-full bg-primary flex items-center justify-center"></div>
<!-- Step 2 Complete -->
<div class="flex-1 h-1 rounded-full bg-primary flex items-center justify-center"></div>
<!-- Step 3 Active -->
<div class="flex-1 h-1.5 rounded-full bg-primary shadow-[0_0_8px_rgba(75,226,119,0.6)]"></div>
<!-- Step 4 Pending -->
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<!-- Step 5 Pending -->
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<!-- Step 6 Pending -->
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col relative w-full px-margin pt-24 pb-28 bg-surface"><div class="flex flex-col w-full gap-space-lg">
<!-- Top Summary Metric Card -->

<!-- Empty State Central Showcase -->
<section class="w-full bg-surface-container-low rounded-xl p-space-xl flex flex-col items-center text-center relative overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 via-transparent to-transparent pointer-events-none"></div>
<!-- Playful Interactive Card Artwork -->
<div class="relative mb-5 mt-2 group cursor-pointer" onclick="openAddCardModal()">
<!-- Pulsing Ambient Aura -->
<div class="absolute -inset-2 bg-primary/20 rounded-full blur-xl group-hover:bg-primary/30 transition-all duration-300"></div>
<!-- Primary Holographic-Style Avatar -->
<div class="relative w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center shadow-lg transition-transform duration-300 group-hover:scale-105">
<span class="material-symbols-outlined text-[36px] text-primary" style="font-variation-settings: 'FILL' 1;">
          credit_card
        </span>
<!-- Plus Badge Accent -->
<span class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-md">
<span class="material-symbols-outlined text-[16px] font-bold">add</span>
</span>
</div>
</div>
<!-- Text Messaging -->
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold mb-2">
      No Credit Cards Linked
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs leading-relaxed mb-6">
      Add your primary credit cards to track statement cutoffs, interest-free days, and alert limits.
    </p>
<!-- Prominent Action CTA -->
<button class="w-full py-3.5 px-6 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md transition-all active:scale-[0.98] hover:bg-primary-container font-semibold" onclick="openAddCardModal()" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span class="">+ Add Credit Card</span>
</button>
</section>
<!-- Card Per-Feature Snapshot Badges -->
<section class="grid grid-cols-2 gap-space-sm w-full">


</section>
<!-- Add Card Quick-Action Drawer Dialog (Simulated Inline Modal) -->
<div class="hidden fixed inset-0 z-50 flex items-end justify-center bg-surface-container-lowest/80 backdrop-blur-sm p-margin pb-safe" id="addCardModal">
<div class="w-full max-w-lg bg-surface-container-high rounded-2xl p-space-lg flex flex-col gap-space-md shadow-2xl relative">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[22px]">add_card</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Quick Add Card</span>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="closeAddCardModal()" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<div class="flex flex-col gap-3 pt-2">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1 block">Card Nickname</label>
<input class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" placeholder="e.g. HDFC Millennia or Axis Magnus" type="text">
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1 block">Credit Limit (₹)</label>
<input class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" placeholder="e.g. 150000" type="number">
</div>
<div class="grid grid-cols-2 gap-2">
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1 block">Statement Date</label>
<input class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" max="31" min="1" placeholder="Day (1-31)" type="number">
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant mb-1 block">Due Date</label>
<input class="w-full h-11 px-3 rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" max="31" min="1" placeholder="Day (1-31)" type="number">
</div>
</div>
</div>
<div class="flex items-center gap-2 pt-2">
<button class="flex-1 h-11 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg font-semibold" onclick="closeAddCardModal()" type="button">
          Cancel
        </button>
<button class="flex-1 h-11 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-semibold shadow-md" onclick="saveCard()" type="button">
          Save Card
        </button>
</div>
</div>
</div>
<script>
    function openAddCardModal() {
      const modal = document.getElementById('addCardModal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeAddCardModal() {
      const modal = document.getElementById('addCardModal');
      if (modal) modal.classList.add('hidden');
    }

    function saveCard() {
      closeAddCardModal();
    }
  </script>
</div></main>
<!-- Bottom Navigation Actions -->
<footer class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl border-t border-outline-variant/15 shadow-[0_-4px_16px_rgba(0,0,0,0.35)]">
<div class="h-20 px-margin flex items-center justify-between gap-3">
<button class="h-12 px-5 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-lg text-label-lg font-semibold transition-colors flex items-center justify-center min-w-[80px] border border-outline-variant/20" type="button">
        Skip
      </button>
<button class="flex-1 h-12 rounded-xl bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-1.5 transition-all shadow-[0_0_16px_rgba(75,226,119,0.35)] active:scale-[0.99]" type="button">
<span>Continue to Income</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</footer>
<!-- Script for Swatch interaction -->
<script>
    function setAccent(color) {
      const icon = document.getElementById('cardIcon');
      const checks = {
        emerald: document.getElementById('swatch-check-emerald'),
        purple: document.getElementById('swatch-check-purple'),
        amber: document.getElementById('swatch-check-amber')
      };

      Object.values(checks).forEach(c => c && c.classList.add('hidden'));

      if (color === 'emerald') {
        checks.emerald.classList.remove('hidden');
        icon.className = 'material-symbols-outlined text-primary text-[24px]';
      } else if (color === 'purple') {
        checks.purple.classList.remove('hidden');
        icon.className = 'material-symbols-outlined text-[#8b5cf6] text-[24px]';
      } else if (color === 'amber') {
        checks.amber.classList.remove('hidden');
        icon.className = 'material-symbols-outlined text-secondary text-[24px]';
      }
    }
  </script>


</body></html>
