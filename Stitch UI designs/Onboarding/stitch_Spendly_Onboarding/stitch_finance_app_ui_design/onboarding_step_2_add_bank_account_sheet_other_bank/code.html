<!DOCTYPE html><html class="dark" lang="en" style=""><head>

<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #051424;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen font-body-md">
<!-- Header matching SCREEN_17 aesthetic -->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.25)]">
<div class="h-16 px-4 flex items-center justify-between">
<button aria-label="Go back" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Bank Accounts</span>
<div class="flex items-center">
<span class="font-label-sm text-label-sm text-primary bg-primary/10 border border-primary/20 px-2.5 py-1 rounded-full font-semibold">
          Step 2 of 6
        </span>
</div>
</div>
<!-- Step Stepper Bar -->
<div class="flex items-center gap-1.5 px-4 pb-2.5 w-full">
<div class="flex-1 h-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="flex-1 h-1 rounded-full bg-primary relative overflow-hidden">
<div class="absolute inset-0 bg-primary/40 animate-pulse"></div>
</div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full px-4 pt-24 pb-28 bg-surface space-y-4"><div class="flex flex-col w-full relative">
<!-- Dimmed & Frosted Underlay Representing Step 2 Background -->
<div aria-hidden="true" class="flex flex-col space-y-4 opacity-40 blur-[2px] pointer-events-none select-none transition-all duration-300">
<div class="flex items-center justify-between px-1">
<div>
<p class="font-headline-sm text-headline-sm text-on-surface font-semibold">Linked Accounts</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Step 2: Aggregate liquid balances</p>
</div>
<div class="h-9 px-3 rounded-full bg-surface-container-high flex items-center gap-1.5 text-primary text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
<span class="">0 Linked</span>
</div>
</div>
<!-- Dummy Account Placeholder Behind -->
<div class="rounded-xl bg-surface-container-low p-4 shadow-sm">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[26px]">account_balance_wallet</span>
</div>
<div class="flex-1">
<div class="h-4 w-32 bg-surface-container-highest rounded-full mb-2"></div>
<div class="h-3 w-48 bg-surface-container rounded-full"></div>
</div>
</div>
</div>
<!-- Decorative Mock Card -->
<div class="rounded-xl bg-surface-container-low p-4 shadow-sm">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[26px]">savings</span>
</div>
<div class="flex-1">
<div class="h-4 w-28 bg-surface-container-highest rounded-full mb-2"></div>
<div class="h-3 w-40 bg-surface-container rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Deep Obsidian Modal Backdrop (Overlays Main Area) -->
<div class="fixed inset-0 z-40 bg-surface-container-lowest/80 backdrop-blur-md transition-opacity"></div>
<!-- Interactive Bottom Sheet Modal -->
<div class="fixed inset-x-0 bottom-0 z-50 max-h-[92vh] flex flex-col rounded-t-2xl bg-surface-container-low shadow-xl overflow-hidden pb-safe transition-transform duration-300 transform translate-y-0">
<!-- Drag Handle Indicator -->
<div class="w-full pt-3 pb-1 flex items-center justify-center cursor-grab active:cursor-grabbing">
<div class="w-10 h-1.5 rounded-full bg-surface-variant opacity-75"></div>
</div>
<!-- Bottom Sheet Header -->
<div class="px-5 pt-2 pb-3 flex items-start justify-between gap-3">
<div class="flex-1 pr-2">
<div class="flex items-center gap-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Add Bank Account</h2>

</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Store bank records securely in your on-device encrypted vault.</p>
</div>
<button aria-label="Close sheet" class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-variant active:scale-95 transition-all" id="closeModalBtn">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Scrollable Modal Body Container -->
<div class="flex-1 overflow-y-auto px-5 pb-6 space-y-4"><!-- Bank Account Configuration Fields -->
<div class="space-y-4" id="instantSyncContainer">
<div class="p-4 rounded-xl bg-surface-container space-y-3.5 shadow-sm border border-outline-variant/20">
<!-- Account Type Selector Segment -->
<div class="space-y-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant font-semibold">Account Type</label>
<div class="grid grid-cols-2 gap-2">
<button class="h-10 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md font-semibold flex items-center justify-center gap-2 shadow-xs transition-colors" id="typeSavings" type="button">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">savings</span>
<span class="">Savings Account</span>
</button>
<button class="h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 transition-colors" id="typeSalary" type="button">
<span class="material-symbols-outlined text-[18px]">payments</span>
<span class="">Current / Salary</span>
</button>
</div>
</div>
<!-- Bank Name Field -->
<div class="space-y-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between" for="customBankName">
<span class="font-semibold">Bank Name</span>
<span class="text-primary font-label-sm text-label-sm font-semibold">Custom Bank</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[18px] pointer-events-none">account_balance</span>
<input class="w-full h-11 pl-9 pr-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md outline-none border border-outline-variant/20 focus:border-primary/40 transition-colors" id="customBankName" placeholder="e.g., Federal Bank, IDFC First, IndusInd" type="text" value="Federal Bank">
</div>
</div>
<!-- Account Nickname Field -->
<div class="space-y-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant font-semibold" for="accNickname">Account Nickname</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 pr-28 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md outline-none border border-outline-variant/20 focus:border-primary/40 transition-colors" id="accNickname" placeholder="e.g. Primary Savings, Emergency Reserve" type="text" value="Primary Savings A/c">
<span class="absolute right-3 text-on-surface-variant font-label-sm text-label-sm pointer-events-none">Federal ••8812</span>
</div>
</div>
<!-- Opening Liquid Balance & MAB Row -->
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1.5 flex flex-col justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant font-semibold h-5 flex items-center" for="liquidBal">Opening Balance</label>
<div class="relative flex items-center">
<span class="absolute left-3 font-headline-sm text-headline-sm text-primary font-bold">₹</span>
<input class="w-full h-11 pl-8 pr-3 rounded-lg bg-surface-container-lowest text-on-surface font-numeric-metric text-numeric-metric outline-none border border-outline-variant/20 focus:border-primary/40 transition-colors" id="liquidBal" type="text" value="1,45,000">
</div>
</div>
<div class="space-y-1.5 flex flex-col justify-between">
<div class="h-5 flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant font-semibold" for="mabInput">Min. Balance (MAB)</label>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 font-headline-sm text-headline-sm text-on-surface-variant font-bold">₹</span>
<input class="w-full h-11 pl-8 pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-numeric-metric text-numeric-metric outline-none border border-outline-variant/20 focus:border-primary/40 transition-colors" id="mabInput" type="text" value="10,000">
<span class="absolute right-3 font-label-sm text-label-sm text-on-surface-variant pointer-events-none">/mo</span>
</div>
</div>
</div>
</div>
<!-- Action Footer Buttons Inside Sheet -->
<div class="pt-1 flex flex-col gap-2">
<button class="w-full h-12 rounded-xl bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 transition-all shadow-[0_0_20px_rgba(34,197,94,0.3)] active:scale-[0.99]" id="linkAccountOtpBtn" type="button">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="">Save Account to Local Vault</span>
</button>
<button class="w-full h-9 rounded-xl bg-transparent hover:bg-surface-container-highest text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors flex items-center justify-center" id="cancelModalBtn" type="button">
Cancel
</button>
</div>
</div></div>
</div>
</div>
<script>
  (() => {
    // Interactive Tab Toggling
    const tabInstant = document.getElementById('tabInstantSync');
    const tabManual = document.getElementById('tabManualEntry');
    const instantContainer = document.getElementById('instantSyncContainer');
    const searchInput = document.getElementById('bankSearchInput');

    if (tabInstant && tabManual) {
      tabInstant.addEventListener('click', () => {
        tabInstant.className = 'flex-1 h-9 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 shadow-sm transition-all duration-200';
        tabManual.className = 'flex-1 h-9 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200';
        if (instantContainer) instantContainer.classList.remove('hidden');
      });

      tabManual.addEventListener('click', () => {
        tabManual.className = 'flex-1 h-9 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 shadow-sm transition-all duration-200';
        tabInstant.className = 'flex-1 h-9 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200';
      });
    }

    // Account Type Toggle
    const typeSavings = document.getElementById('typeSavings');
    const typeSalary = document.getElementById('typeSalary');
    if (typeSavings && typeSalary) {
      typeSavings.addEventListener('click', () => {
        typeSavings.className = 'h-10 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md font-semibold flex items-center justify-center gap-2 shadow-xs transition-colors';
        typeSalary.className = 'h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 transition-colors';
      });

      typeSalary.addEventListener('click', () => {
        typeSalary.className = 'h-10 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md font-semibold flex items-center justify-center gap-2 shadow-xs transition-colors';
        typeSavings.className = 'h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 transition-colors';
      });
    }

    // Bank Selection Pill Highlight
    const bankButtons = document.querySelectorAll('.bank-pill');
    bankButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        bankButtons.forEach(b => {
          b.className = 'bank-pill group flex flex-col items-center justify-center p-2 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all shadow-sm';
          const label = b.querySelector('span');
          if (label) label.classList.remove('font-semibold');
        });
        btn.className = 'bank-pill group flex flex-col items-center justify-center p-2 rounded-xl bg-surface-container-highest ring-1 ring-primary/40 active:scale-95 transition-all shadow-sm';
        const label = btn.querySelector('span');
        if (label) label.classList.add('font-semibold');

        const bankName = btn.getAttribute('data-bank');
        if (searchInput && bankName) {
          searchInput.value = bankName;
        }
      });
    });

    // Close actions
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const handleClose = () => {
      if (window.history.length > 1) {
        window.history.back();
      }
    };
    if (closeBtn) closeBtn.addEventListener('click', handleClose);
    if (cancelBtn) cancelBtn.addEventListener('click', handleClose);
  })();
</script></main>
<!-- Sticky Bottom Navigation CTA Bar -->
