<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#051424;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#ffb3ad", "surface-container-highest": "#273647", "primary-fixed": "#6bff8f", "on-secondary-fixed": "#251a00", "secondary-fixed": "#ffdf9a", "error-container": "#93000a", "surface-container-high": "#1c2b3c", "surface-container-low": "#0d1c2d", "secondary-fixed-dim": "#f7be1d", "on-primary-fixed-variant": "#005321", "surface-dim": "#051424", "on-primary-fixed": "#002109", "on-error-container": "#ffdad6", "inverse-on-surface": "#233143", "on-secondary-fixed-variant": "#5a4300", "primary-container": "#22c55e", "on-surface-variant": "#bccbb9", "on-surface": "#d4e4fa", "on-secondary": "#3f2e00", "error": "#ffb4ab", "on-tertiary-fixed": "#410004", "inverse-primary": "#006e2f", "on-background": "#d4e4fa", "surface-tint": "#4ae176", "inverse-surface": "#d4e4fa", "surface-variant": "#273647", "secondary-container": "#e4ae00", "surface-container-lowest": "#010f1f", "on-primary": "#003915", "secondary": "#ffca45", "on-secondary-container": "#5b4400", "tertiary-fixed": "#ffdad7", "background": "#051424", "tertiary": "#ffb4ae", "primary-fixed-dim": "#4ae176", "tertiary-container": "#ff8a83", "surface": "#051424", "on-tertiary-fixed-variant": "#930013", "on-tertiary-container": "#860011", "on-primary-container": "#004b1e", "surface-container": "#122131", "primary": "#4be277", "on-error": "#690005", "outline": "#869585", "on-tertiary": "#68000a", "outline-variant": "#3d4a3d", "surface-bright": "#2c3a4c" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1rem", "gutter": "1rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "gutter-sm": "0.75rem", "margin": "1rem", "space-md": "0.75rem", "space-sm": "0.5rem", "margin-tablet": "1.5rem" }, "fontFamily": { "numeric-metric": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "display-hero": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "display-hero-mobile": ["Inter"] }, "fontSize": { "numeric-metric": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-hero-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.25)]"><div class="h-16 px-gutter flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0 flex-1"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-xl bg-surface-container/60 text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">Vault Security Pin</h1></div><div class="flex items-center gap-space-sm flex-shrink-0"><div class="px-space-sm py-1 rounded-full bg-primary/10 text-primary font-label-sm text-label-sm tracking-wider uppercase flex items-center justify-center"><span class="w-1.5 h-1.5 rounded-full bg-primary mr-1.5 animate-pulse"></span>Step</div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-safe bg-surface flex-1 min-h-[calc(100vh-4rem)]"><div class="flex flex-col w-full pb-safe">
<!-- Segmented Step Progress Bar -->
<div class="w-full flex items-center justify-between gap-1.5 pt-2 pb-4">
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary flex items-center justify-center relative">
<span class="absolute -top-3 text-[10px] font-label-sm text-primary tracking-tighter">6/6</span>
</div>
</div>
<!-- Hero / Instruction Header -->
<div class="flex flex-col items-center text-center mt-2 mb-4 px-space-sm">
<div class="relative flex items-center justify-center w-14 h-14 rounded-2xl bg-surface-container-high shadow-md mb-3">
<div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-primary/20 via-transparent to-transparent pointer-events-none"></div>
<span class="material-symbols-outlined text-[30px] text-primary" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-1">Create 4-Digit PIN</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
      Establish a local master passcode to encrypt your isolated SQLite biometric vault.
    </p>
</div>
<!-- PIN Dots Visual Display -->
<div class="flex flex-col items-center justify-center my-2">
<div class="flex items-center gap-4 py-3 px-6 rounded-2xl bg-surface-container-low shadow-sm" id="pin-display-container">
<!-- Digit 1: Filled -->
<div class="pin-dot w-4 h-4 rounded-full bg-primary shadow-[0_0_12px_rgba(75,226,119,0.45)] transition-all duration-200"></div>
<!-- Digit 2: Filled -->
<div class="pin-dot w-4 h-4 rounded-full bg-primary shadow-[0_0_12px_rgba(75,226,119,0.45)] transition-all duration-200"></div>
<!-- Digit 3: Empty -->
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200"></div>
<!-- Digit 4: Empty -->
<div class="pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200"></div>
</div>
<span class="h-5 mt-2 font-label-sm text-label-sm text-primary tracking-wider uppercase opacity-90 transition-opacity" id="pin-feedback">
      2 of 4 Digits Staged
    </span>
</div>
<!-- Security Protocol Chip -->
<div class="w-full mt-2 mb-3 px-space-xs">
<div class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl bg-surface-container shadow-sm">
<div class="flex items-center justify-center w-6 h-6 rounded-lg bg-surface-container-high text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[15px]">verified_user</span>
</div>
<div class="min-w-0 flex-1">
<p class="font-label-sm text-label-sm text-on-surface truncate">
          PBKDF2-SHA256 • Hardware Enclave
        </p>
<p class="font-body-sm text-[11px] leading-3 text-on-surface-variant truncate">
          Zero-knowledge protocol • Stored 100% offline
        </p>
</div>
<span class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-primary/10 text-primary font-label-sm text-[10px] font-semibold">
        LOCAL
      </span>
</div>
</div>
<!-- Tactile Numeric Keypad -->
<div class="w-full mt-auto mb-3">
<div class="grid grid-cols-3 gap-2 px-1">
<!-- Row 1 -->
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="1" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">1</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="2" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">2</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="3" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">3</span>
</button>
<!-- Row 2 -->
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="4" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">4</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="5" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">5</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="6" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">6</span>
</button>
<!-- Row 3 -->
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="7" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">7</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="8" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">8</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="9" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">9</span>
</button>
<!-- Row 4 -->
<button aria-label="Biometrics" class="keypad-btn h-12 flex items-center justify-center rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all text-on-surface-variant focus:outline-none" data-key="bio" type="button">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
</button>
<button class="keypad-btn h-12 flex flex-col items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface shadow-sm focus:outline-none" data-key="0" type="button">
<span class="font-numeric-metric text-numeric-metric leading-none">0</span>
</button>
<button aria-label="Delete last digit" class="keypad-btn h-12 flex items-center justify-center rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all text-on-surface-variant focus:outline-none" data-key="backspace" type="button">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
</div>
<!-- Primary & Secondary Actions -->
<div class="w-full flex flex-col gap-2 mt-2">
<button class="w-full h-12 flex items-center justify-center gap-2 rounded-xl bg-primary hover:bg-primary-fixed-dim active:scale-98 text-on-primary font-label-lg text-label-lg shadow-md transition-all font-semibold" id="continue-btn" type="button">
<span>Continue to Confirm PIN</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full h-10 flex items-center justify-center rounded-xl bg-transparent hover:bg-surface-container-low text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors" onclick="history.back()" type="button">
      Back to Vault Security
    </button>
</div>
</div>
<script>
  (() => {
    let currentPin = ['4', '8']; // Staged initial state as requested
    const pinDots = document.querySelectorAll('.pin-dot');
    const feedbackText = document.getElementById('pin-feedback');
    const continueBtn = document.getElementById('continue-btn');

    function updateUi() {
      pinDots.forEach((dot, index) => {
        if (index < currentPin.length) {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-primary shadow-[0_0_12px_rgba(75,226,119,0.45)] transition-all duration-200 scale-105';
        } else {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200 scale-100';
        }
      });

      if (currentPin.length === 4) {
        feedbackText.textContent = 'Passcode Ready';
        feedbackText.classList.remove('text-on-surface-variant');
        feedbackText.classList.add('text-primary');
        continueBtn.classList.remove('opacity-60');
      } else {
        feedbackText.textContent = `${currentPin.length} of 4 Digits Staged`;
        feedbackText.classList.remove('text-primary');
        feedbackText.classList.add('text-on-surface-variant');
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(button => {
      button.addEventListener('click', () => {
        const key = button.getAttribute('data-key');
        if (key >= '0' && key <= '9') {
          if (currentPin.length < 4) {
            currentPin.push(key);
            updateUi();
          }
        } else if (key === 'backspace') {
          if (currentPin.length > 0) {
            currentPin.pop();
            updateUi();
          }
        } else if (key === 'bio') {
          feedbackText.textContent = 'Hardware Token Available';
        }
      });
    });

    continueBtn.addEventListener('click', () => {
      if (currentPin.length === 4) {
        continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Encrypting Vault...</span>';
        setTimeout(() => {
          feedbackText.textContent = 'Vault Key Generated';
        }, 600);
      } else {
        const container = document.getElementById('pin-display-container');
        container.classList.add('translate-x-1');
        setTimeout(() => container.classList.remove('translate-x-1'), 80);
      }
    });

    updateUi();
  })();
</script></main></body></html>
