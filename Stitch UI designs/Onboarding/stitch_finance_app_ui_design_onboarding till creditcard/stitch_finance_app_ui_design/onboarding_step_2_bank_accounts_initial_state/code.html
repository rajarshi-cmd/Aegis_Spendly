<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_stack" name="shell-type">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#051424",
            "surface-dim": "#051424",
            "surface-bright": "#2c3a4c",
            "surface-container-lowest": "#010f1f",
            "surface-container-low": "#0d1c2d",
            "surface-container": "#122131",
            "surface-container-high": "#1c2b3c",
            "surface-container-highest": "#273647",
            "surface-variant": "#273647",
            "background": "#051424",
            "primary": "#4be277",
            "primary-container": "#22c55e",
            "on-primary": "#003915",
            "on-primary-container": "#004b1e",
            "secondary": "#ffca45",
            "secondary-container": "#e4ae00",
            "tertiary": "#ffb4ae",
            "tertiary-container": "#ff8a83",
            "error": "#ffb4ab",
            "error-container": "#93000a",
            "on-surface": "#d4e4fa",
            "on-surface-variant": "#bccbb9",
            "outline": "#869585",
            "outline-variant": "#3d4a3d",
            "inverse-surface": "#d4e4fa",
            "inverse-on-surface": "#233143"
          },
          fontFamily: {
            "display-hero": ["Inter"],
            "display-hero-mobile": ["Inter"],
            "headline-lg": ["Inter"],
            "headline-md": ["Inter"],
            "headline-sm": ["Inter"],
            "body-lg": ["Inter"],
            "body-md": ["Inter"],
            "body-sm": ["Inter"],
            "label-lg": ["Inter"],
            "label-md": ["Inter"],
            "label-sm": ["Inter"],
            "numeric-metric": ["Inter"]
          },
          fontSize: {
            "display-hero": ["40px", { lineHeight: "48px", letterSpacing: "-0.03em", fontWeight: "700" }],
            "display-hero-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.025em", fontWeight: "700" }],
            "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "headline-sm": ["18px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "600" }],
            "numeric-metric": ["24px", { lineHeight: "28px", letterSpacing: "-0.02em", fontWeight: "700" }]
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #051424;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen font-body-md">
<!-- Header matching SCREEN_17 aesthetic -->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.25)]">
<div class="h-16 px-4 flex items-center justify-between">
<button aria-label="Go back" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Bank Accounts</span>
<div class="flex items-center">
<span class="font-label-sm text-label-sm text-primary bg-primary/10 border border-primary/20 px-2.5 py-1 rounded-full font-semibold">
          Step 2 of 6
        </span>
</div>
</div>
<!-- Step Stepper Bar -->
<div class="flex items-center gap-1.5 px-4 pb-2.5 w-full">
<div class="flex-1 h-1 rounded-full bg-primary flex items-center justify-center"></div>
<div class="flex-1 h-1 rounded-full bg-primary relative overflow-hidden">
<div class="absolute inset-0 bg-primary/40 animate-pulse"></div>
</div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full px-4 pt-24 pb-28 bg-surface space-y-4"><div class="flex flex-col w-full space-y-4">
<!-- Top Summary Banner -->

<!-- Main Empty State Container -->
<div class="w-full bg-surface-container-low rounded-2xl p-6 shadow-sm flex flex-col items-center text-center relative overflow-hidden">
<!-- Ambient Backdrop Pulse -->
<div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center relative mb-5">
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping opacity-25"></div>
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<!-- Subtle Decorative Badge -->
<div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary text-[14px] font-bold">add</span>
</div>
</div>
<!-- Empty State Copy -->
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold mb-2">
      No Bank Accounts Linked
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mb-6">
      Add your primary salary or savings account to track liquid runway and avoid unexpected shortfalls.
    </p>
<!-- Connect Bank Action -->
<button class="w-full py-3.5 px-5 rounded-xl bg-primary hover:bg-primary/90 active:scale-[0.99] text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center space-x-2 transition-all shadow-[0_4px_16px_rgba(34,197,94,0.25)]" id="add-bank-trigger" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span class="">Add Bank Account</span>
</button>
<!-- Quick Supported Institutions Teaser -->

</div>
<!-- Manual Entry Fallback Tile -->

<!-- Manual Entry Fallback Tile -->

</div>
<script>
  // Simple micro-interaction for the add bank action
  const addBtn = document.getElementById('add-bank-trigger');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      addBtn.classList.add('opacity-80');
      setTimeout(() => {
        addBtn.classList.remove('opacity-80');
      }, 150);
    });
  }
</script></main>
<!-- Sticky Bottom Navigation CTA Bar -->
<footer class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20 shadow-[0_-4px_16px_rgba(0,0,0,0.35)]">
<div class="h-20 px-4 flex items-center justify-between gap-3">
<button class="h-12 px-5 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg transition-colors flex items-center justify-center" type="button">
        Skip
      </button>
<button class="flex-1 h-12 rounded-xl bg-[#22c55e] hover:bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 transition-all shadow-[0_0_16px_rgba(34,197,94,0.35)] active:scale-[0.99]" type="button">
<span>Continue to Credit Cards</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</footer>


</body></html>
