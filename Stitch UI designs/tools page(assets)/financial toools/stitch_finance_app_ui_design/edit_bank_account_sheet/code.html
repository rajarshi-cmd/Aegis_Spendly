 "space-xs": "0.25rem" }, fontFamily: { "body-md": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "display-hero": ["Inter"], "body-sm": ["Inter"], "label-lg": ["Inter"], "display-hero-mobile": ["Inter"], "body-lg": ["Inter"], "numeric-metric": ["Inter"], "headline-lg": ["Inter"] }, fontSize: { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "display-hero-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "numeric-metric": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Add Financial Asset</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Notifications" class="relative w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[22px]">notifications</span><span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-primary ring-2 ring-surface"></span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full relative">
<!-- Underlying Context: Financial Tools Peek (Subtle ambient mock layer beneath dim sheet) -->
<div class="w-full space-y-space-md opacity-35 filter blur-[2px] pointer-events-none select-none transition-all duration-300">
<div class="p-space-lg rounded-xl bg-surface-container-high space-y-space-sm shadow-md">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Connected Accounts</span>
<span class="font-label-sm text-label-sm text-primary">3 Active</span>
</div>
<div class="h-14 rounded-lg bg-surface-container flex items-center px-space-md justify-between">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
</div>
<div>
<div class="font-label-lg text-label-lg text-on-surface">HDFC Bank</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Salary &amp; Prime</div>
</div>
</div>
<div class="font-numeric-metric text-numeric-metric text-on-surface">₹ 7,85,000</div>
</div>
</div>
</div>
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 z-40 bg-surface-container-lowest/80 backdrop-blur-md transition-opacity duration-300" id="sheet-backdrop"></div>
<!-- Bottom Sheet Modal Anchor -->
<div class="fixed inset-x-0 bottom-0 z-50 max-w-lg mx-auto flex flex-col bg-surface-container-low rounded-t-[28px] shadow-2xl overflow-hidden transition-transform duration-300 ease-out" id="bottom-sheet">
<!-- Grab Handle & Drag Header -->
<div class="w-full pt-3 pb-1 flex flex-col items-center cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 rounded-full bg-surface-bright/70"></div>
</div>
<!-- Header Section with Title & Close Action -->
<div class="px-space-lg pt-space-xs pb-space-sm flex items-start justify-between">
<div class="flex-1 pr-space-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Bank Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Update account nickname, starting balance, and preferences</p>
</div>
<button aria-label="Close edit bank sheet" class="w-9 h-9 -mr-1 rounded-full bg-surface-container-high hover:bg-surface-variant flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="close-modal-btn" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Scrollable Form Body -->
<div class="px-space-lg py-space-sm space-y-space-md max-h-[66vh] overflow-y-auto">
<!-- Field: Bank Name (Locked Institutional Institution Badge) -->
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Bank Entity</label>
<div class="flex items-center justify-between px-space-md h-12 rounded-xl bg-surface-container">
<div class="flex items-center gap-space-sm">
<div class="w-7 h-7 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">HDFC Bank</span>
</div>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-highest">
<span class="material-symbols-outlined text-primary text-[14px]">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Verified</span>
</div>
</div>
</div>
<!-- Field: Account Nickname -->
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase" for="acc-nickname">Account Nickname</label>
<div class="relative flex items-center rounded-xl bg-surface-container focus-within:bg-surface-container-high transition-colors">
<input class="w-full h-12 px-space-md bg-transparent text-on-surface font-body-md text-body-md focus:outline-none placeholder:text-on-surface-variant/40" id="acc-nickname" placeholder="e.g. Household Reserve" type="text" value="Salary &amp; Prime Account"/>
<span class="material-symbols-outlined text-on-surface-variant/60 text-[18px] mr-space-md">edit</span>
</div>
</div>
<!-- Field: Account Type (Segmented Pill Toggle) -->
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Account Classification</label>
<div aria-label="Account Type" class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-surface-container" role="radiogroup">
<button class="segment-btn py-2 rounded-lg font-label-md text-label-md transition-all text-on-primary bg-primary shadow-sm" data-type="savings" type="button">
            Savings
          </button>
<button class="segment-btn py-2 rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface bg-transparent" data-type="current" type="button">
            Current
          </button>
<button class="segment-btn py-2 rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface bg-transparent" data-type="salary" type="button">
            Salary
          </button>
</div>
</div>
<!-- Field: Current Balance Input -->
<div class="space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase" for="acc-balance">Current Ledger Balance</label>
<span class="font-label-sm text-label-sm text-primary">INR (₹)</span>
</div>
<div class="relative flex items-center rounded-xl bg-surface-container focus-within:bg-surface-container-high transition-colors">
<span class="pl-space-md font-headline-sm text-headline-sm text-primary font-bold">₹</span>
<input class="w-full h-12 pl-2 pr-space-md bg-transparent text-on-surface font-numeric-metric text-numeric-metric focus:outline-none placeholder:text-on-surface-variant/40" id="acc-balance" placeholder="0" type="text" value="7,85,000"/>
<div class="pr-space-md">
<span class="px-2 py-0.5 rounded text-[10px] font-label-sm font-semibold tracking-wider uppercase bg-primary/10 text-primary">Live sync</span>
</div>
</div>
</div>
<!-- Field: Linked Payment Notes -->
<div class="space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase" for="acc-notes">Linked Payment Notes</label>
<div class="rounded-xl bg-surface-container focus-within:bg-surface-container-high transition-colors p-space-sm">
<textarea class="w-full bg-transparent text-on-surface font-body-sm text-body-sm focus:outline-none resize-none placeholder:text-on-surface-variant/50" id="acc-notes" placeholder="Optional context or memo for this instrument..." rows="2">Primary salary credit account &amp; mutual fund mandate SIP</textarea>
</div>
</div>
</div>
<!-- Fixed Action Buttons Footer -->
<div class="p-space-lg pt-space-sm bg-surface-container-low space-y-space-sm shadow-xl">
<!-- Primary Save Action -->
<button class="w-full h-12 rounded-xl bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md transition-all active:scale-[0.99]" id="save-btn" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span>Save Bank Changes</span>
</button>
<!-- Secondary Delete Account Action -->
<button class="w-full h-11 rounded-xl bg-error-container/20 hover:bg-error-container/35 text-error font-label-md text-label-md flex items-center justify-center gap-space-xs transition-colors" id="delete-btn" type="button">
<span class="material-symbols-outlined text-[18px]">delete_forever</span>
<span>Delete Account</span>
</button>
<!-- Dismiss / Cancel Link -->
<div class="pt-0.5 flex justify-center">
<button class="py-1 px-4 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" id="cancel-link" type="button">
          Cancel
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    // Segment toggle handling
    const segmentButtons = document.querySelectorAll('.segment-btn');
    segmentButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        segmentButtons.forEach(b => {
          b.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          b.classList.add('bg-transparent', 'text-on-surface-variant');
        });
        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        btn.classList.remove('bg-transparent', 'text-on-surface-variant');
      });
    });

    // Dismiss sheet interaction
    const backdrop = document.getElementById('sheet-backdrop');
    const sheet = document.getElementById('bottom-sheet');
    const closeBtn = document.getElementById('close-modal-btn');
    const cancelLink = document.getElementById('cancel-link');
    const saveBtn = document.getElementById('save-btn');
    const deleteBtn = document.getElementById('delete-btn');

    function closeSheet() {
      sheet.style.transform = 'translateY(100%)';
      backdrop.style.opacity = '0';
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          sheet.style.display = 'none';
          backdrop.style.display = 'none';
        }
      }, 250);
    }

    [backdrop, closeBtn, cancelLink].forEach(el => {
      if (el) el.addEventListener('click', closeSheet);
    });

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Updating Account...</span>';
        setTimeout(closeSheet, 600);
      });
    }

    if (deleteBtn) {
      deleteBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to decouple this bank account? All local sync rules will be archived.')) {
          closeSheet();
        }
      });
    }
  })();
</script></main></body></html>
