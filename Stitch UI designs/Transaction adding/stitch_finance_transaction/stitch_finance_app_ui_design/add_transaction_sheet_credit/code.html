<!DOCTYPE html><html class="dark" lang="en" style="width: 390px; height: 938px; overflow: hidden; position: relative;"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#051424;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-surface": "#d4e4fa", "inverse-primary": "#006e2f", "surface-container": "#122131", "surface-container-lowest": "#010f1f", "background": "#051424", "secondary-fixed": "#ffdf9a", "tertiary-fixed": "#ffdad7", "surface": "#051424", "on-primary-fixed-variant": "#005321", "on-tertiary-fixed-variant": "#930013", "primary": "#4be277", "on-surface": "#d4e4fa", "error": "#ffb4ab", "surface-container-high": "#1c2b3c", "on-secondary-fixed-variant": "#5a4300", "on-error": "#690005", "surface-variant": "#273647", "on-background": "#d4e4fa", "on-primary": "#003915", "secondary-fixed-dim": "#f7be1d", "tertiary-fixed-dim": "#ffb3ad", "on-surface-variant": "#bccbb9", "on-secondary-container": "#5b4400", "surface-tint": "#4ae176", "inverse-on-surface": "#233143", "on-tertiary-container": "#860011", "surface-container-highest": "#273647", "secondary-container": "#e4ae00", "on-primary-container": "#004b1e", "on-error-container": "#ffdad6", "surface-dim": "#051424", "primary-fixed": "#6bff8f", "on-secondary-fixed": "#251a00", "primary-fixed-dim": "#4ae176", "secondary": "#ffca45", "tertiary": "#ffb4ae", "on-tertiary-fixed": "#410004", "on-primary-fixed": "#002109", "outline": "#869585", "on-tertiary": "#68000a", "tertiary-container": "#ff8a83", "outline-variant": "#3d4a3d", "error-container": "#93000a", "surface-container-low": "#0d1c2d", "on-second     body {
      min-height: max(884px, 100dvh);

</head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col justify-end min-h-screen relative w-full bg-black/60 pb-safe"><div class="flex flex-col w-full">
<!-- Interactive Modal Frame Simulation -->
<div class="relative w-full rounded-t-3xl bg-surface-container border-t border-surface-container-highest shadow-2xl px-margin pt-3 pb-8 flex flex-col gap-space-lg">
<!-- Modal Header Action Bar -->
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full mx-auto mb-1"></div><div class="flex items-center justify-between"><div class="w-9 h-9"></div><div class="flex items-center justify-center"><div class="w-9 h-9 rounded-xl bg-surface-container-high border border-[#52b788]/30 flex items-center justify-center shadow-sm"><svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polygon fill="currentColor" opacity="0.2" points="12 7 15 12 9 12 12 7"></polygon></svg></div></div><button aria-label="Close" class="w-9 h-9 rounded-xl bg-surface-container-high hover:bg-surface-bright flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button></div>
<!-- Segmented Transaction Type Selector -->
<div class="w-full bg-surface-container-lowest p-1 rounded-xl flex items-center"><button class="type-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface font-medium text-center transition-all flex items-center justify-center gap-1.5" onclick="selectType('expense', this)" type="button">
<span class="material-symbols-outlined text-[16px]">trending_down</span>
        Debit
      </button>
<button class="type-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-primary bg-primary font-semibold text-center transition-all shadow-sm flex items-center justify-center gap-1.5" onclick="selectType('income', this)" type="button">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
        Credit
      </button>
<button class="type-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface font-medium text-center transition-all flex items-center justify-center gap-1.5" onclick="selectType('transfer', this)" type="button">
<span class="material-symbols-outlined text-[16px]">swap_horiz</span>
        Self-Transfer
      </button></div>
<!-- Hero Numeric Display & Quick Chips -->
<div class="flex flex-col items-center justify-center py-4 bg-surface-container-lowest rounded-xl relative overflow-hidden">
<!-- Glow ambient background -->
<div class="absolute -top-12 inset-x-12 h-24 bg-[#40916c]/15 blur-2xl rounded-full pointer-events-none"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Transaction Value</span>
<div class="flex items-baseline justify-center gap-1 text-on-surface">
<span class="font-headline-lg text-headline-lg font-medium text-on-surface-variant">₹</span>
<span class="font-display-hero-mobile text-display-hero-mobile tracking-tight font-bold text-on-surface" id="amount-display">0.00</span>
<span class="w-0.5 h-8 bg-primary animate-pulse ml-0.5 rounded-full inline-block self-center"></span>
</div>
<!-- Quick Amount Increment Chips -->
</div>
<!-- Account Sources ("From Source") -->
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant font-medium">To Destination / Deposit Account</label><div class="relative w-full"><div class="flex items-center justify-between bg-surface-container-lowest rounded-xl p-3 border border-sage hover:bg-surface-container-high transition-colors cursor-pointer"><div class="flex items-center gap-3 min-w-0"><div class="w-8 h-8 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[18px]">account_balance</span></div><div class="flex flex-col min-w-0"><span class="font-label-md text-label-md font-semibold text-on-surface truncate">Primary Bank Account</span><span class="font-label-sm text-label-sm text-on-surface-variant truncate">Available Balance: ₹1,24,500</span></div></div><span class="material-symbols-outlined text-on-surface-variant text-[20px]">expand_more</span></div></div></div>
<!-- Dynamic "To Destination / Merchant" Input -->
<div class="flex flex-col gap-2" id="destination-block"><label class="font-label-md text-label-md text-on-surface-variant font-medium" id="dest-label">Payer / Source</label><div class="relative w-full flex items-center bg-surface-container-lowest rounded-xl p-2.5 border-sage"><span class="material-symbols-outlined text-on-surface-variant ml-1 mr-2 text-[20px]" id="dest-icon">payments</span><input class="bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-outline w-full" id="merchant-input" placeholder="e.g. Employer, Client, Refund" type="text" value="Acme Corp (Payroll)"><button class="text-on-surface-variant hover:text-on-surface p-1" type="button"><span class="material-symbols-outlined text-[18px]">mic</span></button></div></div>
<!-- Category Selector -->
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant font-medium">Income Category</label><div class="relative w-full"><div class="flex items-center justify-between bg-surface-container-lowest rounded-xl p-3 border-sage hover:bg-surface-container-high transition-colors cursor-pointer"><div class="flex items-center gap-2.5 min-w-0"><div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[18px]">paid</span></div><span class="font-body-md text-body-md font-medium text-on-surface truncate">Salary &amp; Wages</span></div><span class="material-symbols-outlined text-on-surface-variant text-[20px]">expand_more</span></div></div></div>
<!-- Date & Additional Metadata Row -->
<!-- Notes & Memo Row -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Optional Memo &amp; Tags</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl p-2.5">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">edit_note</span>
<input class="bg-transparent border-none outline-none font-body-sm text-body-sm text-on-surface placeholder:text-outline w-full" placeholder="e.g. Monthly stipend, Consulting invoice #104" type="text">
</div>
</div>
<!-- Action Prompt Visual Confirmation -->
<!-- Full-width Bottom Action CTA -->
<button class="record-pulse w-full py-4 rounded-xl bg-gradient-to-r from-[#2d6a4f] to-[#40916c] hover:from-[#40916c] hover:to-[#52b788] text-white font-label-lg text-label-lg font-bold shadow-lg shadow-[#40916c]/25 hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-[#52b788]/30" id="submit-btn" type="button"><span class="material-symbols-outlined text-[20px] text-[#b7e4c7]">check_circle</span><span class="">Record Credit</span></button>
</div>
</div>
<script>
  let currentAmount = 0.00;

  function updateAmountDisplay() {
    const el = document.getElementById('amount-display');
    if (el) {
      el.textContent = currentAmount.toFixed(2);
    }
  }

  function addAmount(val) {
    currentAmount += val;
    updateAmountDisplay();
  }

  function setMaxAmount() {
    currentAmount = 12450.00;
    updateAmountDisplay();
  }

  function resetAmount() {
    currentAmount = 0.00;
    updateAmountDisplay();
  }

  function selectType(type, button) {
    const buttons = document.querySelectorAll('.type-btn');
    buttons.forEach(btn => {
      btn.className = "type-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface font-medium text-center transition-all flex items-center justify-center gap-1.5";
    });

    button.className = "type-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-on-primary bg-primary font-semibold text-center transition-all shadow-sm flex items-center justify-center gap-1.5";

    const label = document.getElementById('dest-label');
    const input = document.getElementById('merchant-input');
    const icon = document.getElementById('dest-icon');

    if (type === 'transfer') {
      label.textContent = "To Destination Account";
      input.placeholder = "Select Target Asset or Account (e.g. Mercury Vault)";
      input.value = "Mercury Treasury";
      icon.textContent = "account_balance";
    } else if (type === 'income') {
      label.textContent = "Income Source / Client";
      input.placeholder = "e.g. Stripe Payout, Acquired LLC";
      input.value = "Stripe Payout";
      icon.textContent = "payments";
    } else {
      label.textContent = "Merchant or Payee";
      input.placeholder = "e.g. Blue Bottle Coffee, Whole Foods";
      input.value = "Blue Bottle Coffee";
      icon.textContent = "storefront";
    }
  }

  function selectAccount(el) {
    const cards = document.querySelectorAll('.account-card');
    cards.forEach(c => c.classList.add('opacity-70'));
    el.classList.remove('opacity-70');
  }

  function selectCategory(el) {
    const chips = document.querySelectorAll('.category-chip');
    chips.forEach(c => {
      c.className = "category-chip flex-shrink-0 px-3.5 py-2 rounded-xl bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md font-medium flex items-center gap-1.5 transition-all";
    });
    el.className = "category-chip flex-shrink-0 px-3.5 py-2 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md font-semibold flex items-center gap-1.5 shadow-sm transition-all";
  }

  document.getElementById('submit-btn').addEventListener('click', () => {
    const btn = document.getElementById('submit-btn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Syncing Ledger...';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">task_alt</span> Saved Successfully!';
      btn.classList.add('bg-primary');
    }, 800);
  });
</script></main>


</body></html>
