</head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col justify-end relative w-full min-h-screen bg-black/60 pb-safe"><div class="flex flex-col w-full relative">
<div class="fixed inset-0 bg-surface-container-lowest/70 backdrop-blur-sm transition-opacity" id="backdrop"></div>
<div class="relative w-full bg-surface-container rounded-t-3xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden z-10">
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-10 h-1 rounded-full bg-surface-variant"></div>
</div>
<div class="px-5 pt-1 pb-4 flex items-start justify-between">
<div class="flex flex-col pr-3">
<h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Add Fixed Commitment</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Record recurring EMI, SIP, rent, or subscription</p>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto px-5 pb-6 space-y-5">
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-2">Commitment Type</label>
<div class="grid grid-cols-2 gap-2" id="type-selector">
<button class="commitment-chip flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface-container-high text-primary font-label-md text-label-md transition-all text-left" type="button">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="truncate">EMI / Loan</span>
</button>
<button class="commitment-chip flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md text-label-md transition-all text-left" type="button">
<span class="material-symbols-outlined text-[18px]">trending_up</span>
<span class="truncate">SIP / Investment</span>
</button>
<button class="commitment-chip flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md text-label-md transition-all text-left" type="button">
<span class="material-symbols-outlined text-[18px]">home</span>
<span class="truncate">Rent / Lease</span>
</button>
<button class="commitment-chip flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md text-label-md transition-all text-left" type="button">
<span class="material-symbols-outlined text-[18px]">subscriptions</span>
<span class="truncate">Subscription / Bill</span>
</button>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-1.5" for="commitment-title">Title &amp; Note</label>
<div class="relative bg-surface-container-lowest rounded-xl flex items-center px-3.5 py-3">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">description</span>
<input class="w-full bg-transparent text-on-surface font-body-md text-body-md placeholder-outline focus:outline-none" id="commitment-title" placeholder="e.g., Home Loan EMI, Netflix, Gym" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-1.5" for="commitment-amount">Recurring Amount</label>
<div class="relative bg-surface-container-lowest rounded-xl flex items-center px-4 py-3">
<span class="font-numeric-metric text-numeric-metric text-primary mr-2 select-none">₹</span>
<input class="w-full bg-transparent text-on-surface font-numeric-metric text-numeric-metric placeholder-outline/50 focus:outline-none" id="commitment-amount" inputmode="numeric" placeholder="15,000" type="number"/>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase px-2 py-1 rounded bg-surface-container-high select-none">INR</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-1.5" for="due-day">Due Day</label>
<div class="relative bg-surface-container-lowest rounded-xl flex items-center px-3 py-3">
<span class="material-symbols-outlined text-outline text-[18px] mr-2">event</span>
<select class="w-full bg-transparent text-on-surface font-body-md text-body-md appearance-none focus:outline-none pr-4" id="due-day">
<option class="bg-surface-container text-on-surface" value="1">1st of month</option>
<option class="bg-surface-container text-on-surface" value="5">5th of month</option>
<option class="bg-surface-container text-on-surface" selected="" value="10">10th of month</option>
<option class="bg-surface-container text-on-surface" value="15">15th of month</option>
<option class="bg-surface-container text-on-surface" value="20">20th of month</option>
<option class="bg-surface-container text-on-surface" value="25">25th of month</option>
<option class="bg-surface-container text-on-surface" value="last">Last day</option>
</select>
<span class="material-symbols-outlined text-outline text-[16px] absolute right-3 pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-1.5" for="frequency">Frequency</label>
<div class="relative bg-surface-container-lowest rounded-xl flex items-center px-3 py-3">
<span class="material-symbols-outlined text-outline text-[18px] mr-2">update</span>
<select class="w-full bg-transparent text-on-surface font-body-md text-body-md appearance-none focus:outline-none pr-4" id="frequency">
<option class="bg-surface-container text-on-surface" selected="" value="monthly">Monthly</option>
<option class="bg-surface-container text-on-surface" value="quarterly">Quarterly</option>
<option class="bg-surface-container text-on-surface" value="annual">Annual</option>
</select>
<span class="material-symbols-outlined text-outline text-[16px] absolute right-3 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant mb-1.5" for="payment-source">Payment Source</label>
<div class="relative bg-surface-container-lowest rounded-xl flex items-center px-3.5 py-3">
<span class="material-symbols-outlined text-primary text-[20px] mr-2.5">account_balance_wallet</span>
<select class="w-full bg-transparent text-on-surface font-body-md text-body-md appearance-none focus:outline-none pr-5" id="payment-source">
<option class="bg-surface-container text-on-surface" selected="" value="hdfc">HDFC Bank — Salary (•••• 4021)</option>
<option class="bg-surface-container text-on-surface" value="icici">ICICI Bank — Savings (•••• 9812)</option>
<option class="bg-surface-container text-on-surface" value="amex">Amex Platinum Reserve (•••• 1004)</option>
<option class="bg-surface-container text-on-surface" value="sbi">SBI Card Prime (•••• 6720)</option>
</select>
<span class="material-symbols-outlined text-outline text-[18px] absolute right-3 pointer-events-none">expand_more</span>
</div>
</div>
<div class="pt-2 flex flex-col gap-2">
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-lg active:scale-[0.99] transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
          Save Fixed Commitment
        </button>
<button class="w-full py-2.5 text-center text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors" type="button">
          Cancel
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const chips = document.querySelectorAll('.commitment-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.classList.remove('bg-surface-container-high', 'text-primary');
          c.classList.add('bg-surface-container-low', 'text-on-surface-variant');
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.classList.remove('text-primary');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        });
        chip.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        chip.classList.add('bg-surface-container-high', 'text-primary');
        const icon = chip.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.add('text-primary');
          icon.style.fontVariationSettings = "'FILL' 1";
        }
      });
    });
  })();
</script></main>
</body></html>
