<script>
  (function() {
    const monthCells = document.querySelectorAll('.month-cell');
    const yearPills = document.querySelectorAll('.year-pill');
    const rangeText = document.getElementById('cycle-range-text');
    const applyBtn = document.getElementById('apply-cycle-btn');
    const resetBtn = document.getElementById('reset-current-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const overlay = document.getElementById('cycle-modal-overlay');

    let currentYear = '2024';
    let selectedMonthName = 'Nov';

    const monthDaysMap = {
      'Jan': 31, 'Feb': 29, 'Mar': 31, 'Apr': 30, 'May': 31, 'Jun': 30,
      'Jul': 31, 'Aug': 31, 'Sep': 30, 'Oct': 31, 'Nov': 30, 'Dec': 31
    };

    function updateRange() {
      const days = monthDaysMap[selectedMonthName] || 30;
      if (rangeText) {
        rangeText.textContent = `1st ${selectedMonthName} – ${days}th ${selectedMonthName} ${currentYear}`;
      }
    }

    monthCells.forEach(cell => {
      cell.addEventListener('click', () => {
        monthCells.forEach(c => {
          c.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-[0_4px_16px_rgba(34,197,94,0.35)]', 'scale-[1.02]');
          c.classList.add('bg-surface-container');
          const subText = c.querySelector('.font-label-sm');
          if (subText && !subText.textContent.includes('Current')) {
            subText.className = 'font-label-sm text-label-sm text-on-surface-variant opacity-70';
          }
          const check = c.querySelector('.material-symbols-outlined');
          if (check && check.textContent.includes('check_circle')) {
            check.remove();
          }
        });

        cell.classList.remove('bg-surface-container', 'opacity-85');
        cell.classList.add('bg-primary-container', 'text-on-primary', 'shadow-[0_4px_16px_rgba(34,197,94,0.35)]', 'scale-[1.02]');
        
        const label = cell.querySelector('.font-label-lg');
        if (label) {
          selectedMonthName = label.textContent.trim();
        }
        updateRange();
      });
    });

    yearPills.forEach(pill => {
      pill.addEventListener('click', () => {
        yearPills.forEach(p => {
          p.classList.remove('bg-surface-container-high', 'text-primary', 'font-semibold', 'shadow-sm');
          p.classList.add('text-on-surface-variant');
          const pulse = p.querySelector('span:nth-child(2)');
          if (pulse) pulse.remove();
        });
        pill.classList.add('bg-surface-container-high', 'text-primary', 'font-semibold', 'shadow-sm');
        pill.classList.remove('text-on-surface-variant');
        currentYear = pill.textContent.trim().replace(/[^0-9]/g, '');
        updateRange();
      });
    });

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        selectedMonthName = 'Nov';
        currentYear = '2024';
        updateRange();
      });
    }

    if (applyBtn) {
      applyBtn.addEventListener('click', () => {
        applyBtn.classList.add('opacity-90');
        const icon = applyBtn.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = 'done_all';
        setTimeout(() => {
          if (icon) icon.textContent = 'check';
        }, 1200);
      });
    }

    if (closeBtn && overlay) {
      const dismiss = () => {
        overlay.classList.add('opacity-0');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
        }, 1500);
      };
      closeBtn.addEventListener('click', dismiss);
      overlay.addEventListener('click', dismiss);
    }
  })();
</script></main>
