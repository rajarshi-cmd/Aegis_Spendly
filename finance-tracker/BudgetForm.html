<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa; color: #1a1a2e; font-size: 14px;
    }
    .header {
      background: #1a1a2e; color: #e0e0e0; padding: 16px;
      text-align: center; font-size: 15px; font-weight: 700;
    }
    .form-container { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    input, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus {
      outline: none; border-color: #e67e22;
      box-shadow: 0 0 0 3px rgba(230,126,34,0.1);
    }
    .budget-row {
      display: flex; gap: 8px; align-items: center;
      padding: 8px; background: #fff; border: 1px solid #eee;
      border-radius: 8px; margin-bottom: 6px;
    }
    .budget-row .cat { flex: 1; font-size: 13px; font-weight: 600; }
    .budget-row input {
      width: 100px; text-align: right; font-size: 13px; padding: 6px 8px;
    }
    .budget-row .remove {
      cursor: pointer; color: #e74c3c; font-weight: bold;
      padding: 4px 8px; font-size: 16px;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      background: #e67e22; margin-top: 8px;
    }
    .btn:hover { background: #d35400; }
    .btn-add {
      background: #eee; color: #333; padding: 10px; border: none;
      border-radius: 8px; width: 100%; cursor: pointer; font-size: 13px;
      margin-bottom: 12px;
    }
    .feedback {
      padding: 10px 14px; border-radius: 8px; margin: 10px 0;
      font-size: 13px; display: none;
    }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .feedback.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .section-title {
      font-size: 12px; font-weight: 700; color: #e67e22;
      text-transform: uppercase; margin: 12px 0 8px;
    }
  </style>
</head>
<body>
  <div class="header">💵 Monthly Budgets</div>
  <div class="form-container">
    <div id="feedback" class="feedback"></div>

    <div class="form-group">
      <label>Month</label>
      <input type="month" id="budgetMonth">
    </div>

    <div class="section-title">Expense Budgets</div>
    <div id="budgetList"></div>

    <button class="btn-add" onclick="addBudgetRow()">+ Add Category Budget</button>

    <button class="btn" onclick="saveBudgets()">Save Budgets</button>
  </div>

  <script>
    let expenseCategories = [];

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      document.getElementById('budgetMonth').value =
        now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

      google.script.run.withSuccessHandler(function(data) {
        expenseCategories = data.expenseCategories || [];
        addBudgetRow();
      }).getAllMasterData();
    });

    function addBudgetRow() {
      const container = document.getElementById('budgetList');
      const div = document.createElement('div');
      div.className = 'budget-row';
      div.innerHTML = `
        <select class="cat" style="flex:1;padding:6px 8px;font-size:13px;border:1px solid #ddd;border-radius:6px;">
          <option value="">Select…</option>
          ${expenseCategories.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
        <input type="number" class="budget-amt" placeholder="0.00" step="0.01" min="0">
        <span class="remove" onclick="this.parentElement.remove()">✕</span>
      `;
      container.appendChild(div);
    }

    function saveBudgets() {
      const month = document.getElementById('budgetMonth').value;
      if (!month) { showFeedback('Select a month.', 'error'); return; }

      const rows = document.querySelectorAll('.budget-row');
      const budgets = [];
      rows.forEach(row => {
        const cat = row.querySelector('.cat').value;
        const amt = row.querySelector('.budget-amt').value;
        if (cat && amt) {
          budgets.push({ category: cat, type: 'Expense', amount: amt });
        }
      });

      if (budgets.length === 0) { showFeedback('Add at least one budget entry.', 'error'); return; }

      google.script.run.withSuccessHandler(function(result) {
        showFeedback(result.message, result.success ? 'success' : 'error');
      }).saveBudget(month, budgets);
    }

    function showFeedback(msg, type) {
      const el = document.getElementById('feedback');
      el.textContent = msg; el.className = 'feedback ' + type;
      if (type === 'success') setTimeout(() => el.className = 'feedback', 4000);
    }
  </script>
</body>
</html>
