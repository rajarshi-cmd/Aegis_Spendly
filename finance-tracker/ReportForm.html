<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa; color: #1a1a2e; font-size: 14px;
    }
    .header {
      background: #1a1a2e; color: #e0e0e0; padding: 16px;
      text-align: center; font-size: 15px; font-weight: 700;
    }
    .form-container { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    select, input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
    }
    select:focus, input:focus {
      outline: none; border-color: #27ae60;
      box-shadow: 0 0 0 3px rgba(39,174,96,0.1);
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
      background: #27ae60; text-transform: uppercase; letter-spacing: 1px;
      margin-top: 8px;
    }
    .btn:hover { background: #219a52; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback {
      padding: 12px 16px; border-radius: 8px; margin: 12px 0;
      font-size: 13px; display: none; line-height: 1.5;
    }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .feedback.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .report-desc {
      background: #f0f7f4; padding: 10px 14px; border-radius: 8px;
      font-size: 12px; color: #555; margin-bottom: 14px; line-height: 1.5;
      border-left: 3px solid #27ae60;
    }
    .row-2 { display: flex; gap: 10px; }
    .row-2 .form-group { flex: 1; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">📋 Generate Report</div>
  <div class="form-container">
    <div id="feedback" class="feedback"></div>

    <div class="form-group">
      <label>Report Type</label>
      <select id="reportType" onchange="updateDescription()">
        <option value="monthly">Monthly Statement</option>
        <option value="yearly">Yearly Statement</option>
        <option value="category">Category-wise Breakdown</option>
        <option value="cashflow">Cash Flow Report</option>
        <option value="account">Account-wise Balance</option>
        <option value="budget_vs_actual">Budget vs Actual</option>
      </select>
    </div>

    <div id="reportDesc" class="report-desc">
      Complete income & expense statement for a selected month with totals and savings rate.
    </div>

    <div class="row-2">
      <div class="form-group" id="monthGroup">
        <label>Month</label>
        <select id="month">
          <option value="1">January</option><option value="2">February</option>
          <option value="3">March</option><option value="4">April</option>
          <option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option>
          <option value="9">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select id="year"></select>
      </div>
    </div>

    <button class="btn" id="genBtn" onclick="generateReport()">Generate Report</button>
  </div>

  <script>
    const descriptions = {
      monthly: 'Complete income & expense statement for a selected month with totals and savings rate.',
      yearly: 'Full year income vs expenses summary with all transactions listed.',
      category: 'Spending breakdown by category with percentage of total — see where your money goes.',
      cashflow: '12-month cash flow view showing income, expenses, net, and cumulative balance.',
      account: 'Summary of inflows and outflows per account/wallet.',
      budget_vs_actual: 'Compare your budgeted amounts with actual spending — highlights over/under categories.'
    };

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      document.getElementById('month').value = now.getMonth() + 1;

      const yearSel = document.getElementById('year');
      for (let y = now.getFullYear(); y >= now.getFullYear() - 5; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        yearSel.appendChild(opt);
      }
    });

    function updateDescription() {
      const type = document.getElementById('reportType').value;
      document.getElementById('reportDesc').textContent = descriptions[type] || '';
      // Hide month for yearly/cashflow
      document.getElementById('monthGroup').style.display =
        (type === 'yearly' || type === 'cashflow') ? 'none' : 'block';
    }

    function generateReport() {
      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Generating…';

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false; btn.textContent = 'Generate Report';
          const fb = document.getElementById('feedback');
          fb.textContent = result.message;
          fb.className = 'feedback ' + (result.success ? 'success' : 'error');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.textContent = 'Generate Report';
          const fb = document.getElementById('feedback');
          fb.textContent = 'Error: ' + err.message;
          fb.className = 'feedback error';
        })
        .generateReport(
          document.getElementById('reportType').value,
          document.getElementById('month').value,
          document.getElementById('year').value
        );
    }
  </script>
</body>
</html>
