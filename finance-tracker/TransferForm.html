<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa; color: #1a1a2e; font-size: 14px;
    }
    .header {
      background: #1a1a2e; color: #e0e0e0; padding: 16px;
      text-align: center; font-size: 15px; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .form-container { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      color: #666; text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .required::after { content: ' *'; color: #e74c3c; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: #fff; transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
    }
    input.error, select.error { border-color: #e74c3c; }
    textarea { resize: vertical; min-height: 60px; }
    .amount-input {
      font-size: 20px; font-weight: 700; text-align: center;
      color: #2980b9; letter-spacing: 1px;
    }
    .transfer-arrow {
      text-align: center; font-size: 28px; padding: 6px 0;
      color: #3498db;
    }
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
      background: #2980b9; text-transform: uppercase; letter-spacing: 1px;
      margin-top: 8px; transition: background 0.2s;
    }
    .btn-submit:hover { background: #2471a3; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback {
      padding: 12px 16px; border-radius: 8px; margin: 12px 0;
      font-size: 13px; display: none; line-height: 1.5;
    }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .feedback.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">🔄 Transfer Between Accounts</div>
  <div class="form-container">
    <div id="feedback" class="feedback"></div>

    <div class="form-group">
      <label class="required">Amount</label>
      <input type="number" id="amount" class="amount-input" placeholder="0.00" step="0.01" min="0.01">
    </div>

    <div class="form-group">
      <label class="required">Date</label>
      <input type="date" id="txnDate">
    </div>

    <div class="form-group">
      <label class="required">From Account</label>
      <select id="fromAccount"><option value="">Select…</option></select>
    </div>

    <div class="transfer-arrow">⬇</div>

    <div class="form-group">
      <label class="required">To Account</label>
      <select id="toAccount"><option value="">Select…</option></select>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea id="notes" placeholder="Transfer reason…"></textarea>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitTransfer()">Transfer Funds</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
      google.script.run.withSuccessHandler(function(data) {
        populateSelect('fromAccount', data.accounts);
        populateSelect('toAccount', data.accounts);
      }).getAllMasterData();
    });

    function populateSelect(id, items) {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">Select…</option>';
      (items || []).forEach(function(item) {
        const opt = document.createElement('option');
        opt.value = item; opt.textContent = item;
        sel.appendChild(opt);
      });
    }

    function submitTransfer() {
      const from = document.getElementById('fromAccount').value;
      const to = document.getElementById('toAccount').value;
      const amount = document.getElementById('amount').value;

      if (!from || !to || !amount) {
        showFeedback('Please fill all required fields.', 'error'); return;
      }
      if (from === to) {
        showFeedback('Source and destination accounts must be different.', 'error'); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Transferring…';

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false; btn.textContent = 'Transfer Funds';
          showFeedback(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            document.getElementById('amount').value = '';
            document.getElementById('notes').value = '';
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.textContent = 'Transfer Funds';
          showFeedback('Error: ' + err.message, 'error');
        })
        .submitTransfer({
          date: document.getElementById('txnDate').value,
          amount: amount,
          fromAccount: from,
          toAccount: to,
          notes: document.getElementById('notes').value
        });
    }

    function showFeedback(msg, type) {
      const el = document.getElementById('feedback');
      el.textContent = msg; el.className = 'feedback ' + type;
      if (type === 'success') setTimeout(() => el.className = 'feedback', 5000);
    }
  </script>
</body>
</html>
