<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa; color: #1a1a2e; font-size: 14px;
    }
    .header {
      background: #1a1a2e; color: #e0e0e0; padding: 16px;
      text-align: center; font-size: 15px; font-weight: 700;
    }
    .form-container { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      color: #666; text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus {
      outline: none; border-color: #8e44ad;
      box-shadow: 0 0 0 3px rgba(142,68,173,0.1);
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      background: #8e44ad; margin-top: 8px; transition: background 0.2s;
    }
    .btn:hover { background: #7d3c98; }
    .feedback {
      padding: 10px 14px; border-radius: 8px; margin: 10px 0;
      font-size: 13px; display: none; line-height: 1.4;
    }
    .feedback.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
    .feedback.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .section-title {
      font-size: 12px; font-weight: 700; color: #8e44ad;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 0 6px; border-bottom: 1px solid #eee; margin-bottom: 12px;
    }
    .current-items {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
    }
    .item-chip {
      background: #f3e5f5; color: #6a1b9a; padding: 4px 10px;
      border-radius: 12px; font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">📝 Manage Master Data</div>
  <div class="form-container">
    <div id="feedback" class="feedback"></div>

    <div class="form-group">
      <label>Select Master Data Type</label>
      <select id="masterType" onchange="loadCurrentItems()">
        <option value="">Select…</option>
        <option value="M_IncomeCategories">Income Categories</option>
        <option value="M_ExpenseCategories">Expense Categories</option>
        <option value="M_PaymentModes">Payment Modes</option>
        <option value="M_Accounts">Accounts / Wallets</option>
        <option value="M_Vendors">Vendors / Payees</option>
        <option value="M_IncomeSources">Income Sources</option>
      </select>
    </div>

    <div id="currentItemsSection" style="display:none;">
      <div class="section-title">Current Items</div>
      <div class="current-items" id="currentItems"></div>
    </div>

    <div class="section-title" style="margin-top:16px;">Add New Item</div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" id="itemName" placeholder="Enter new item name">
    </div>

    <div class="form-group" id="categoryField" style="display:none;">
      <label>Default Category (for vendors)</label>
      <input type="text" id="itemCategory" placeholder="e.g. Shopping, Food">
    </div>

    <div class="form-group" id="typeField" style="display:none;">
      <label>Account Type (for accounts)</label>
      <select id="itemType">
        <option value="Bank">Bank</option>
        <option value="Cash">Cash</option>
        <option value="Credit">Credit Card</option>
        <option value="Wallet">Digital Wallet</option>
        <option value="Investment">Investment</option>
      </select>
    </div>

    <div class="form-group" id="balanceField" style="display:none;">
      <label>Opening Balance</label>
      <input type="number" id="itemBalance" value="0" step="0.01">
    </div>

    <button class="btn" onclick="addItem()">Add Item</button>
  </div>

  <script>
    document.getElementById('masterType').addEventListener('change', function() {
      const val = this.value;
      document.getElementById('categoryField').style.display = val === 'M_Vendors' ? 'block' : 'none';
      document.getElementById('typeField').style.display = val === 'M_Accounts' ? 'block' : 'none';
      document.getElementById('balanceField').style.display = val === 'M_Accounts' ? 'block' : 'none';
    });

    function loadCurrentItems() {
      const sheetName = document.getElementById('masterType').value;
      if (!sheetName) {
        document.getElementById('currentItemsSection').style.display = 'none';
        return;
      }
      google.script.run.withSuccessHandler(function(items) {
        const container = document.getElementById('currentItems');
        container.innerHTML = (items || []).map(i => `<span class="item-chip">${i}</span>`).join('');
        document.getElementById('currentItemsSection').style.display = 'block';
      }).getMasterData(sheetName);
    }

    function addItem() {
      const sheetName = document.getElementById('masterType').value;
      const name = document.getElementById('itemName').value.trim();
      if (!sheetName || !name) {
        showFeedback('Select a type and enter a name.', 'error'); return;
      }

      let values;
      if (sheetName === 'M_Accounts') {
        values = [name, document.getElementById('itemType').value,
                  parseFloat(document.getElementById('itemBalance').value) || 0, 'Yes'];
      } else if (sheetName === 'M_Vendors') {
        values = [name, document.getElementById('itemCategory').value || '', 'Yes'];
      } else {
        values = [name, 'Yes'];
      }

      google.script.run.withSuccessHandler(function(result) {
        showFeedback(result.message, result.success ? 'success' : 'error');
        if (result.success) {
          document.getElementById('itemName').value = '';
          loadCurrentItems();
        }
      }).addMasterDataItem(sheetName, values);
    }

    function showFeedback(msg, type) {
      const el = document.getElementById('feedback');
      el.textContent = msg; el.className = 'feedback ' + type;
      if (type === 'success') setTimeout(() => el.className = 'feedback', 4000);
    }
  </script>
</body>
</html>
